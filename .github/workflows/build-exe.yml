name: Build Windows EXE

# main 브랜치에 push 되거나, Actions 탭에서 수동 실행(workflow_dispatch)할 때 빌드합니다.
on:
  push:
    branches: [ "main" ]
    paths:
      - "audit_sampling_tool.py"
      - "requirements.txt"
      - ".github/workflows/build-exe.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build EXE with PyInstaller
        run: |
          pyinstaller --onefile --windowed --name "AuditSamplingTool" audit_sampling_tool.py

      - name: Upload EXE as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AuditSamplingTool-windows-exe
          path: dist/AuditSamplingTool.exe

      - name: Create GitHub Release with EXE
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "AuditSamplingTool Windows Build #${{ github.run_number }}"
          files: dist/AuditSamplingTool.exe
          body: |
            자동 빌드된 Windows용 실행 파일입니다.
            (서명되지 않은 파일이라 다운로드/실행 시 Windows SmartScreen
            보안 경고가 뜰 수 있으나, "추가 정보 > 실행"으로 진행하시면 됩니다.)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
